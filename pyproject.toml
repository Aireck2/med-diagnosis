[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "med-diagnosis"
version = "0.2.0"
description = "Interactive Sequential Bayesian Inference Simulator for stepped medical diagnostics (COVID-19, Pulmonary TB, Dengue)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
app = [
    "streamlit>=1.39,<2",
    "plotly>=5.20,<8",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
med_diagnosis = ["data/*.sql", "data/*.json", "data/*.db"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
