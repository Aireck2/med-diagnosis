<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="algoritmo-bayes-title algoritmo-bayes-desc" id="algoritmo-bayes-root">
        <title id="algoritmo-bayes-title">Algoritmo de inferencia bayesiana secuencial</title>
        <desc id="algoritmo-bayes-desc">Diagrama de flujo del bucle iterativo que inicializa la partición en t=0, selecciona verosimilitudes según el signo observado, evalúa la Probabilidad Total y actualiza la posterior exacta en cada etapa hasta retornar SimulationTrace.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #algoritmo-bayes-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #algoritmo-bayes-root { font-family: var(--font-sans); color: var(--color-ink); }
      #algoritmo-bayes-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#algoritmo-bayes-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="algoritmo-bayes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="algoritmo-bayes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="algoritmo-bayes-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 1. Connectors (drawn first, behind masks and nodes) -->
        <!-- Start -> Init t=0 -->
        <line x1="480" y1="84" x2="480" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Init t=0 -> Loop merge dot -->
        <line x1="480" y1="160" x2="480" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Loop merge dot -> Loop condition diamond -->
        <line x1="480" y1="184" x2="480" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Loop condition -> Return SimulationTrace (NO, right) -->
        <line x1="604" y1="232" x2="760" y2="232" stroke="#bf4520" stroke-width="1.4" marker-end="url(#algoritmo-bayes-arrow-accent)"/>
        <!-- Loop condition -> Observation diamond (SI, down) -->
        <line x1="480" y1="268" x2="480" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Observation diamond -> Positive likelihoods (SI, right) -->
        <line x1="604" y1="340" x2="760" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Observation diamond -> Negative likelihoods (NO, down) -->
        <line x1="480" y1="372" x2="480" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Negative likelihoods -> Branch merge dot -->
        <line x1="480" y1="456" x2="480" y2="476" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Positive likelihoods -> Branch merge dot -->
        <path d="M 920,364 V 472 Q 920,480 912,480 H 484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Branch merge dot -> Total Prob & Bayes Recurrence -->
        <line x1="480" y1="484" x2="480" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Bayes Recurrence -> Natural Frequencies & Advance -->
        <line x1="480" y1="556" x2="480" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#algoritmo-bayes-arrow)"/>
        <!-- Advance -> Loop merge dot (left return channel) -->
        <path d="M 320,610 H 208 Q 200,610 200,602 V 188 Q 200,180 208,180 H 476" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#algoritmo-bayes-arrow)"/>

        <!-- 2. Arrow labels on opaque masks -->
        <rect x="640" y="212" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="221" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO (FIN)</text>

        <rect x="492" y="282" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="508" y="291" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SI</text>

        <rect x="652" y="320" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="329" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SI (+)</text>

        <rect x="492" y="384" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="393" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO (-)</text>

        <rect x="96" y="388" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="144" y="397" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ITERAR ETAPA</text>

        <!-- 3. Nodes (9 nodes + 2 merge dots) -->
        <!-- Node 1: Start oval -->
        <rect x="360" y="40" width="240" height="44" rx="20" fill="#f5f5f5"/>
        <rect x="360" y="40" width="240" height="44" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="480" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recibir P₀(E), cadena y N</text>

        <!-- Node 2: Validate & Init t=0 -->
        <rect x="320" y="108" width="320" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validar cotas e iniciar t = 0</text>
        <text x="480" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P₀(Eᶜ) = 1 − P₀(E) · t = 1 · P_prev = P₀(E)</text>

        <!-- Merge dot 1: Loop entry -->
        <circle cx="480" cy="180" r="4" fill="#2d3142"/>

        <!-- Node 3: Loop condition diamond -->
        <polygon points="480,196 604,232 480,268 356,232" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Quedan etapas</text>
        <text x="480" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">t ≤ n?</text>

        <!-- Node 4: End oval — Return SimulationTrace (CORAL #2) -->
        <rect x="760" y="204" width="320" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="760" y="204" width="320" height="56" rx="20" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="920" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retornar SimulationTrace</text>
        <text x="920" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">traza exacta P₀..Pₙ + frecuencias</text>

        <!-- Node 5: Observation sign diamond -->
        <polygon points="480,308 604,340 480,372 356,340" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Observación</text>
        <text x="480" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Oₜ es '+'?</text>

        <!-- Node 6: Positive likelihoods -->
        <rect x="760" y="316" width="320" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="920" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verosimilitud positiva (+)</text>
        <text x="920" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L_E = Sens · L_Ec = 1 − Espec</text>

        <!-- Node 7: Negative likelihoods -->
        <rect x="320" y="408" width="320" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verosimilitud negativa (-)</text>
        <text x="480" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">L_E = 1 − Sens · L_Ec = Espec</text>

        <!-- Merge dot 2: Likelihood branches rejoin -->
        <circle cx="480" cy="480" r="4" fill="#2d3142"/>

        <!-- Node 8: Total Probability & Bayes Recurrence (FOCAL CORAL #1) -->
        <rect x="320" y="504" width="320" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="504" width="320" height="52" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="480" y="526" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Probabilidad Total y Bayes</text>
        <text x="480" y="544" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">P(Oₜ) = J_E + J_Ec · Pₜ(E) = J_E / P(Oₜ)</text>

        <!-- Node 9: Natural frequencies & step advance -->
        <rect x="320" y="584" width="320" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="606" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frecuencias |Ω| y avanzar etapa</text>
        <text x="480" y="624" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">VPₜ, FNₜ, FPₜ, VNₜ · P_prev ← Pₜ(E) · t + 1</text>

        <!-- 4. Legend (bottom 60px strip: y=660..720) -->
        <line x1="40" y1="660" x2="1240" y2="660" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA · RECURRENCIA DISCRETA</text>

        <rect x="40" y="688" width="24" height="12" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="72" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entrada / retorno (óvalo)</text>

        <rect x="252" y="688" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="284" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cálculo racional exacto</text>

        <polygon points="468,694 480,688 492,694 480,700" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="504" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Condición lógica</text>

        <line x1="640" y1="694" x2="672" y2="694" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#algoritmo-bayes-arrow)"/>
        <text x="680" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Retorno iterativo (t + 1)</text>

        <rect x="864" y="688" width="24" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="896" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Actualización de Bayes / salida</text>
      </svg>
