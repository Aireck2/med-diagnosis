<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dominio-clases-title dominio-clases-desc" id="dominio-clases-root">
        <title id="dominio-clases-title">Modelo de clases del dominio med_diagnosis</title>
        <desc id="dominio-clases-desc">Diagrama de clases UML que muestra el agregado SimulationTrace compuesto por BayesianStepResult y NaturalFrequencyBreakdown, asociado a PrevalenceScenario, junto con PathologyProfile, TestApplication y DiagnosticTestSpec.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dominio-clases-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dominio-clases-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dominio-clases-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dominio-clases-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="dominio-clases-uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="dominio-clases-uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142"/>
          </marker>
          <marker id="dominio-clases-uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
          </marker>
          <marker id="dominio-clases-uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- 1. Relationships (drawn first, behind masks and class boxes) -->
        <!-- R1: SimulationTrace (x=460) composed of NaturalFrequencyBreakdown (x=360) -->
        <line x1="460" y1="120" x2="360" y2="120" stroke="#2d3142" stroke-width="1" marker-start="url(#dominio-clases-uml-diamond-filled)"/>
        <!-- R2: SimulationTrace (600,224) composed of BayesianStepResult (600,284) -->
        <line x1="600" y1="224" x2="600" y2="284" stroke="#2d3142" stroke-width="1" marker-start="url(#dominio-clases-uml-diamond-filled)"/>
        <!-- R3: SimulationTrace (712,224) associated with PrevalenceScenario (960,284) -->
        <path d="M 712,224 V 248 Q 712,256 720,256 H 952 Q 960,256 960,264 V 284" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#dominio-clases-uml-open)"/>
        <!-- R4: PathologyProfile (1080,192) composed of PrevalenceScenario (1080,284) -->
        <line x1="1080" y1="192" x2="1080" y2="284" stroke="#2d3142" stroke-width="1" marker-start="url(#dominio-clases-uml-diamond-filled)"/>
        <!-- R5: PathologyProfile (1180,116) composed of DiagnosticTestSpec (1180,548) via right margin -->
        <path d="M 1180,116 H 1220 Q 1228,116 1228,124 V 540 Q 1228,548 1220,548 H 1180" fill="none" stroke="#2d3142" stroke-width="1" marker-start="url(#dominio-clases-uml-diamond-filled)"/>
        <!-- R6: BayesianStepResult (600,428) composed of TestApplication (600,488) -->
        <line x1="600" y1="428" x2="600" y2="488" stroke="#2d3142" stroke-width="1" marker-start="url(#dominio-clases-uml-diamond-filled)"/>
        <!-- R7: TestApplication (760,540) aggregates DiagnosticTestSpec (880,540) -->
        <line x1="760" y1="540" x2="880" y2="540" stroke="#2d3142" stroke-width="1" marker-start="url(#dominio-clases-uml-diamond-hollow)"/>

        <!-- 2. Multiplicity labels on opaque masks (clear of strokes and boxes) -->
        <!-- R1 multiplicities (y=120, x=360..460) -->
        <rect x="424" y="100" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="434" y="109" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="368" y="100" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="382" y="109" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1..*</text>

        <!-- R2 multiplicities (x=600, y=224..284) -->
        <rect x="572" y="236" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="582" y="245" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="564" y="264" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="578" y="273" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>

        <!-- R3 multiplicities (Association SimulationTrace -> PrevalenceScenario) -->
        <rect x="720" y="232" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="734" y="241" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>
        <rect x="928" y="264" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="938" y="273" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <!-- R4 multiplicities (x=1080, y=192..284) -->
        <rect x="1088" y="204" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1098" y="213" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="1088" y="264" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1102" y="273" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1..*</text>

        <!-- R5 multiplicities (PathologyProfile -> DiagnosticTestSpec) -->
        <rect x="1192" y="96" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1202" y="105" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="1188" y="528" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1202" y="537" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1..*</text>

        <!-- R6 multiplicities (x=600, y=428..488) -->
        <rect x="608" y="440" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="618" y="449" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
        <rect x="608" y="468" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="618" y="477" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <!-- R7 multiplicities (y=540, x=760..880) -->
        <rect x="780" y="520" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="794" y="529" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>
        <rect x="848" y="520" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="858" y="529" fill="#2d3142" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

        <!-- 3. UML Class Boxes (7 classes, <=5 members per compartment) -->

        <!-- Class 1: NaturalFrequencyBreakdown (x=60, y=40, w=300, h=164) -->
        <rect x="60" y="40" width="300" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="60" y1="76" x2="360" y2="76" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="60" y1="168" x2="360" y2="168" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="210" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NaturalFrequencyBreakdown</text>
        <text x="76" y="96" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ step_index: int</text>
        <text x="76" y="114" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ cohort_size: int</text>
        <text x="76" y="132" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ rounded_diseased: int</text>
        <text x="76" y="150" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ rounded_true_positives: int | None</text>
        <text x="76" y="188" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ exact_posterior_from_counts(): Fraction</text>

        <!-- Class 2: SimulationTrace (FOCAL CORAL, x=460, y=40, w=300, h=184) -->
        <rect x="460" y="40" width="300" height="184" rx="6" fill="#f5f5f5"/>
        <rect x="460" y="40" width="300" height="184" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <line x1="460" y1="76" x2="760" y2="76" stroke="#bf4520" stroke-width="1" stroke-opacity="0.40"/>
        <line x1="460" y1="148" x2="760" y2="148" stroke="#bf4520" stroke-width="1" stroke-opacity="0.40"/>
        <text x="610" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SimulationTrace</text>
        <text x="476" y="96" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ pathology_slug: str</text>
        <text x="476" y="114" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ pathology_name: str</text>
        <text x="476" y="132" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ cohort_size: int</text>
        <text x="476" y="168" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ initial_prior(): Fraction</text>
        <text x="476" y="186" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ final_posterior(): Fraction</text>
        <text x="476" y="204" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ total_belief_shift(): Fraction</text>

        <!-- Class 3: PathologyProfile (x=880, y=40, w=300, h=152) -->
        <rect x="880" y="40" width="300" height="152" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="880" y1="76" x2="1180" y2="76" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="1030" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PathologyProfile</text>
        <text x="896" y="98" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ slug: str</text>
        <text x="896" y="116" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: str</text>
        <text x="896" y="134" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ target_population: str</text>
        <text x="896" y="152" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ clinical_context: str</text>
        <text x="896" y="170" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ citations: tuple[Citation, ...]</text>

        <!-- Class 4: BayesianStepResult (x=460, y=284, w=300, h=144) -->
        <rect x="460" y="284" width="300" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="460" y1="320" x2="760" y2="320" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="610" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BayesianStepResult</text>
        <text x="476" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ step_index: int</text>
        <text x="476" y="358" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ prior: Fraction</text>
        <text x="476" y="376" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ marginal_observation_prob: Fraction</text>
        <text x="476" y="394" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ posterior: Fraction</text>
        <text x="476" y="412" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ belief_delta: Fraction</text>

        <!-- Class 5: PrevalenceScenario (x=880, y=284, w=300, h=144) -->
        <rect x="880" y="284" width="300" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="880" y1="320" x2="1180" y2="320" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="880" y1="392" x2="1180" y2="392" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="1030" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PrevalenceScenario</text>
        <text x="896" y="340" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ stratum_name: str</text>
        <text x="896" y="358" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ clinical_description: str</text>
        <text x="896" y="376" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ prior: Fraction</text>
        <text x="896" y="412" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ complement(): Fraction</text>

        <!-- Class 6: TestApplication (x=460, y=488, w=300, h=104) -->
        <rect x="460" y="488" width="300" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="460" y1="524" x2="760" y2="524" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="610" y="510" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TestApplication</text>
        <text x="476" y="548" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ test: DiagnosticTestSpec</text>
        <text x="476" y="568" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ observation: Observation</text>

        <!-- Class 7: DiagnosticTestSpec (x=880, y=472, w=300, h=164) -->
        <rect x="880" y="472" width="300" height="164" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="880" y1="508" x2="1180" y2="508" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <line x1="880" y1="580" x2="1180" y2="580" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
        <text x="1030" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DiagnosticTestSpec</text>
        <text x="896" y="528" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name: str</text>
        <text x="896" y="546" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ sensitivity: Fraction</text>
        <text x="896" y="564" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ specificity: Fraction</text>
        <text x="896" y="600" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ false_positive_rate(): Fraction</text>
        <text x="896" y="618" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ false_negative_rate(): Fraction</text>

        <!-- 4. Complete 6-item UML Relationship Legend (bottom 60px strip: y=660..720) -->
        <line x1="40" y1="660" x2="1240" y2="660" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA · VOCABULARIO DE RELACIONES UML</text>

        <line x1="40" y1="696" x2="68" y2="696" stroke="#2d3142" stroke-width="1" marker-end="url(#dominio-clases-uml-triangle)"/>
        <text x="76" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Herencia</text>

        <line x1="204" y1="696" x2="232" y2="696" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#dominio-clases-uml-triangle)"/>
        <text x="240" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realización</text>

        <line x1="388" y1="696" x2="416" y2="696" stroke="#2d3142" stroke-width="1" marker-start="url(#dominio-clases-uml-diamond-filled)"/>
        <text x="424" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Composición · posee</text>

        <line x1="600" y1="696" x2="628" y2="696" stroke="#2d3142" stroke-width="1" marker-start="url(#dominio-clases-uml-diamond-hollow)"/>
        <text x="636" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Agregación · referencia</text>

        <line x1="828" y1="696" x2="856" y2="696" stroke="#4f5d75" stroke-width="1" marker-end="url(#dominio-clases-uml-open)"/>
        <text x="864" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Asociación</text>

        <line x1="1008" y1="696" x2="1036" y2="696" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dominio-clases-uml-open)"/>
        <text x="1044" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependencia · usa</text>
      </svg>
